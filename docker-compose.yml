version: "3.9"
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      # Synonym file must live inside ES's config dir to be referenced by
      # `synonym_path` in the analyzer settings.
      - ./es/synonyms.txt:/usr/share/elasticsearch/config/analysis/synonyms.txt
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: search_service
      POSTGRES_USER: search_app
      POSTGRES_PASSWORD: search_pw
    
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  esdata:
  pgdata:
